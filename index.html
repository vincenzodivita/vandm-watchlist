<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V&M Watchlist</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
<div class="login-box">
<h1>🎬 V&M Watchlist</h1>
<div class="user-buttons">
<button class="user-btn vincenzo-btn" onclick="login('vincenzo')">Vincenzo 🇮🇹</button>
<button class="user-btn millena-btn" onclick="login('millena')">Millena 🇧🇷</button>
</div>
</div>
</div>

<!-- App Screen -->
<div id="appScreen" class="app-screen">
<div class="container">
<div class="header">
            <h2 id="welcomeText">Benvenuto!</h2>
            <div class="header-buttons">
                <button id="syncWatchBtn" class="sync-btn" onclick="openSyncWatch()" title="Guarda insieme in sincronizzazione">
                    🔗 Watch Together
                </button>
                <button class="edit-btn" onclick="openEditSyncModal()" title="Modifica link di sincronizzazione">
                    ✏️
                </button>
                <a href="https://meet.google.com/uyp-veyu-nok" target="_blank" class="videocall-btn">📹 Videochiamata</a>
                <button class="logout-btn" onclick="logout()">Esci</button>
            </div>
        </div>
        <div class="tabs">
            <button id="mainTabCatalogBtn" class="tab-btn active" onclick="switchMainTab('catalog', this)">🎬 Catalogo</button>
            <button id="mainTabListBtn" class="tab-btn" onclick="switchMainTab('list', this)">📋 Lista</button>
        </div>

        <div class="content">
            <!-- Catalog Tab -->
            <div id="catalogTab" class="tab-content">
                <input type="text" id="searchBox" class="search-box" placeholder="Cerca nel catalogo...">

                <div class="filter-section">
                    <div class="filter-row">
                        <span id="labelMediaType" class="filter-label">Tipo:</span>
                        <div id="mediaTypeControls" class="filter-buttons">
                            <button id="movieTypeMovies" class="filter-btn active" onclick="setMediaType('movie', this)">Film</button>
                            <button id="movieTypeTv" class="filter-btn" onclick="setMediaType('tv', this)">Serie TV</button>
                        </div>
                    </div>

                    <div class="filter-row">
                        <span id="labelPlatforms" class="filter-label">Piattaforme:</span>
                        <div id="providerControls" class="filter-buttons">
                            <button id="providerAllBtn" class="filter-btn active" onclick="toggleProvider('all')">Tutte</button>
                            <button id="providerDisneyBtn" class="filter-btn" onclick="toggleProvider('disney')">Disney+</button>
                            <button id="providerNetflixBtn" class="filter-btn" onclick="toggleProvider('netflix')">Netflix</button>
                            <button id="providerPrimeBtn" class="filter-btn" onclick="toggleProvider('prime')">Prime Video</button>
                        </div>
                    </div>

                    <div class="filter-row">
                        <span id="labelCatalogGenres" class="filter-label">Genere:</span>
                        <div id="catalogGenreControls" class="filter-buttons genre-buttons"></div>
                    </div>

                    <div class="filter-row">
                        <span id="labelFilterView" class="filter-label">Filtra:</span>
                        <div class="filter-buttons">
                            <button id="filterUnsavedBtn" class="filter-btn filter-toggle-btn" onclick="toggleFilterUnsaved(this)">👁️ Solo non in lista o visti</button>
                        </div>
                    </div>
                </div>

                <div id="catalogContent">
                    <div id="catalogGrid" class="movies-grid"></div>
                    <div id="catalogPagination" class="pagination"></div>
                </div>
            </div>

            <!-- List Tab -->
            <div id="listTab" class="tab-content" style="display: none;">
                <input type="text" id="listSearchBox" class="search-box" placeholder="Cerca tra i titoli salvati...">

                <div class="filter-section">
                    <div class="filter-row">
                        <div id="listTypeControls" class="filter-buttons list-filter-buttons">
                            <button id="listTypeMyListBtn" class="filter-btn active" onclick="switchListSubTab('mylist', this)">La Mia Lista</button>
                            <button id="listTypeSharedBtn" class="filter-btn" onclick="switchListSubTab('shared', this)">Da Vedere Insieme ❤️</button>
                            <button id="listTypeSeenBtn" class="filter-btn" onclick="switchListSubTab('seen', this)">Già Visti ✓</button>
                            <button id="listTypeCalendarBtn" class="filter-btn" onclick="switchListSubTab('calendar', this)">📅 Calendario</button>
                        </div>
                    </div>

                    <div class="filter-row">
                        <span id="labelListMediaType" class="filter-label">Tipo:</span>
                        <div id="listMediaTypeControls" class="filter-buttons">
                            <button id="listTypeAllBtn" class="filter-btn active" onclick="setListMediaType('all', this)">Tutti</button>
                            <button id="listTypeMovieBtn" class="filter-btn" onclick="setListMediaType('movie', this)">Film</button>
                            <button id="listTypeTvBtn" class="filter-btn" onclick="setListMediaType('tv', this)">Serie TV</button>
                        </div>
                    </div>

                    <div class="filter-row">
                        <span id="labelListGenres" class="filter-label">Genere:</span>
                        <div id="listGenreControls" class="filter-buttons genre-buttons"></div>
                    </div>
                </div>

                <div class="shared-list">
                    <h3 id="listSectionTitle">La Mia Lista</h3>
                    <div id="listContent"></div>
                </div>
            </div>
        </div>
</div>
</div>

<!-- Modal for movie details -->
<div id="movieModal" class="modal" onclick="closeModal(event)">
<div class="modal-content" onclick="event.stopPropagation()">
<div class="modal-header">
<img id="modalBackdrop" class="modal-backdrop" src="" alt="">
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-body">
<h2 id="modalTitle" class="modal-title"></h2>
<div class="modal-meta">
<span id="modalYear"></span>
<span id="modalRating" class="modal-rating"></span>
</div>
<p id="modalOverview" class="modal-overview"></p>
<div class="modal-actions">
<button id="modalAddButton" class="modal-button primary" onclick="toggleMovieFromModal()"></button>
<button class="modal-button secondary" onclick="closeModal()">Chiudi</button>
</div>
</div>
</div>
</div>

<!-- Modal for editing sync link -->
<div id="editSyncModal" class="modal" onclick="closeEditSyncModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 600px;">
        <div class="sync-modal-body">
            <button class="modal-close" onclick="closeEditSyncModal()">&times;</button>
            <h2 class="modal-title" id="syncModalTitle">Modifica Link Sincronizzazione</h2>
            <p style="margin-bottom: 15px; opacity: 0.8;" id="syncModalDescription">
                Inserisci il link generato dall'estensione di sincronizzazione (es. Teleparty, Syncwatch)
            </p>
            <input 
                type="url" 
                id="syncLinkInput" 
                class="sync-input" 
                placeholder="https://..."
            >
            <div class="sync-modal-buttons">
                <button class="modal-button primary" onclick="saveSyncLink()">
                    💾 Salva
                </button>
                <button class="modal-button secondary" onclick="closeEditSyncModal()">
                    Annulla
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal for setting/changing seen date -->
<div id="datePickerModal" class="modal" onclick="closeDatePickerModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 420px;">
        <div class="sync-modal-body">
            <button class="modal-close" onclick="closeDatePickerModal()">&times;</button>
            <h2 class="modal-title" id="datePickerModalTitle">📅 Data di Visione</h2>
            <p id="datePickerModalDesc" style="margin-bottom: 15px; opacity: 0.85;">
                Quando hai visto questo film?
            </p>
            <input type="date" id="seenDateInput" class="sync-input" style="font-size: 1.1em; padding: 10px; text-align: center; color-scheme: dark;">
            <div class="sync-modal-buttons" style="margin-top: 15px;">
                <button class="modal-button primary" onclick="confirmSaveSeenDate()">
                    💾 Salva Data
                </button>
                <button class="modal-button secondary" onclick="closeDatePickerModal()">
                    Annulla
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Floating Sync Toast Feedback -->
<div id="syncToast" class="sync-toast" aria-live="polite">
    <span id="syncToastIcon" class="sync-toast-icon">🔄</span>
    <span id="syncToastMessage" class="sync-toast-message"></span>
</div>

<script src="script.js"></script>
</body>
</html>
